<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語 N5 Training System</title>
<style>
/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080e; --panel:#0b101c; --card:#101728; --card2:#141d33;
  --line:#1e2a45; --line2:#2a3a5e;
  --txt:#dbe5f5; --dim:#7b89a6; --dim2:#5b6784;
  --acc:#00e2b8; --acc2:#6d5efc; --acc3:#ff5c8a;
  --warn:#ffb020; --bad:#ff4d6d; --good:#3ddc97;
  --jp:"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP","MS PGothic",sans-serif;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ui);
  font-size:15px; line-height:1.6; overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 12% -5%, rgba(0,226,184,.07), transparent 60%),
    radial-gradient(800px 500px at 95% 5%, rgba(109,94,252,.09), transparent 60%),
    linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#080c14}
::-webkit-scrollbar-thumb{background:#1f2c47;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#2c3d61}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}

/* ================= LAYOUT ================= */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex:0 0 248px;background:linear-gradient(180deg,#080d16,#0a1120);
  border-right:1px solid var(--line);padding:16px 12px 40px;
  position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:60;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.main{margin-left:248px;flex:1;min-width:0;padding:18px 26px 90px;max-width:1400px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-family:var(--jp);font-weight:700;
  color:#04121a;font-size:19px;box-shadow:0 0 18px rgba(0,226,184,.35)
}
.brand h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;line-height:1.25}
.brand small{display:block;font-size:10px;color:var(--dim2);letter-spacing:.18em}
.navsec{font-size:10px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;padding:14px 10px 6px;font-weight:700}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  color:var(--dim);font-size:13.5px;margin-bottom:2px;border:1px solid transparent;
  transition:.16s;position:relative
}
.nav a:hover{background:var(--card);color:var(--txt);border-color:var(--line)}
.nav a.on{background:linear-gradient(90deg,rgba(0,226,184,.14),rgba(0,226,184,.02));color:var(--acc);border-color:rgba(0,226,184,.28)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.nav .ic{width:18px;text-align:center;font-size:14px;flex:0 0 18px}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.burger{display:none;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px}
.topbar .spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--dim)
}
.chip b{color:var(--txt)}
.chip.acc{border-color:rgba(0,226,184,.35);color:var(--acc);background:rgba(0,226,184,.07)}
.chip.xp{border-color:rgba(109,94,252,.4);color:#a99cff;background:rgba(109,94,252,.09)}
.chip.fire{border-color:rgba(255,176,32,.4);color:var(--warn);background:rgba(255,176,32,.08)}

/* ================= CARDS ================= */
.card{
  background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;
  position:relative;overflow:hidden;animation:fade .38s ease both
}
.card.glow{border-color:rgba(0,226,184,.3);box-shadow:0 0 34px rgba(0,226,184,.08) inset,0 0 22px rgba(0,226,184,.06)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.05),transparent 42%);opacity:.5}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.card h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.card h3{font-size:15px;font-weight:700;margin:16px 0 8px;color:var(--txt);display:flex;align-items:center;gap:8px}
.card h3:first-child{margin-top:0}
.card p{color:var(--dim);font-size:14px}
.muted{color:var(--dim)}
.small{font-size:12.5px}
.tiny{font-size:11.5px;color:var(--dim2)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

.hero{
  background:linear-gradient(135deg,rgba(0,226,184,.09),rgba(109,94,252,.11)),linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid rgba(0,226,184,.24);
}
.hero .kicker{font-size:11px;letter-spacing:.2em;color:var(--acc);text-transform:uppercase;font-weight:800;margin-bottom:8px}
.hero h2{font-size:26px;line-height:1.2}
.jp{font-family:var(--jp);font-size:1.06em}
.fur{color:var(--dim2);font-size:.82em;font-family:var(--jp)}
.rom{color:var(--acc2);font-size:.83em;font-style:italic;font-family:var(--mono)}

/* ================= GRID ================= */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

.stat{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  transition:.2s;position:relative;overflow:hidden
}
.stat:hover{border-color:var(--line2);transform:translateY(-2px)}
.stat .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.stat .val{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--dim2);margin-top:2px}
.stat.a .val{color:var(--acc)} .stat.b .val{color:#a99cff} .stat.c .val{color:var(--warn)} .stat.d .val{color:var(--acc3)}

/* ================= BARS ================= */
.bar{height:8px;border-radius:8px;background:#0a1120;border:1px solid var(--line);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.thin{height:5px}
.bar.warn>i{background:linear-gradient(90deg,var(--warn),var(--acc3))}
.bar.bad>i{background:linear-gradient(90deg,var(--bad),var(--acc3))}
.bar.good>i{background:linear-gradient(90deg,var(--good),var(--acc))}
.brow{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--dim)}
.brow b{color:var(--txt);font-weight:700}

/* ================= BUTTONS ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:var(--card2);border:1px solid var(--line2);color:var(--txt);transition:.18s;
  white-space:nowrap
}
.btn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,226,184,.13)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#00b394);color:#03130f;border-color:transparent;box-shadow:0 6px 22px rgba(0,226,184,.28)}
.btn.pri:hover{color:#03130f;box-shadow:0 8px 28px rgba(0,226,184,.42)}
.btn.sec{background:linear-gradient(135deg,var(--acc2),#4b3fd6);color:#fff;border-color:transparent}
.btn.sec:hover{color:#fff;box-shadow:0 8px 26px rgba(109,94,252,.4)}
.btn.gh{background:transparent;border-color:var(--line2);color:var(--dim)}
.btn.gh:hover{color:var(--acc);border-color:var(--acc)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.danger{border-color:rgba(255,77,109,.4);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:#fff;background:rgba(255,77,109,.15)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ================= SECTIONS ================= */
.sec{
  border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(160deg,var(--card),var(--card2));transition:.2s
}
.sec:hover{border-color:var(--line2)}
.sec.done{border-color:rgba(61,220,151,.35);background:linear-gradient(160deg,rgba(61,220,151,.05),var(--card2))}
.sec-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.sec-h .ic{font-size:17px;width:24px;text-align:center}
.sec-h .t{font-weight:700;font-size:14.5px;flex:1}
.sec-h .pct{font-size:11.5px;color:var(--dim2);font-family:var(--mono)}
.sec-h .arw{color:var(--dim2);transition:.25s;font-size:12px}
.sec.open .arw{transform:rotate(90deg)}
.sec-b{display:none;padding:0 18px 18px;border-top:1px solid var(--line);margin-top:2px;padding-top:16px}
.sec.open .sec-b{display:block;animation:fade .25s ease}

/* ================= TAGS / PILLS ================= */
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line2);color:var(--dim)}
.tag.acc{color:var(--acc);border-color:rgba(0,226,184,.4);background:rgba(0,226,184,.08)}
.tag.b{color:#a99cff;border-color:rgba(109,94,252,.4);background:rgba(109,94,252,.1)}
.tag.c{color:var(--warn);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.09)}
.tag.bad{color:var(--bad);border-color:rgba(255,77,109,.4);background:rgba(255,77,109,.09)}
.tag.good{color:var(--good);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.09)}

/* ================= GRAMMAR BLOCKS ================= */
.gblock{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;background:#0c1322}
.gblock .gt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gblock .gt .name{font-family:var(--jp);font-size:20px;font-weight:700;color:var(--acc)}
.gblock .gt .en{font-size:13px;color:var(--dim)}
.whybox{border:1px solid rgba(109,94,252,.3);background:rgba(109,94,252,.06);border-radius:11px;padding:14px;margin-top:12px;display:none}
.whybox.open{display:block;animation:fade .3s ease}
.whybox h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a99cff;margin-bottom:6px;font-weight:800}
.whybox .item{margin-bottom:12px}
.whybox .item:last-child{margin-bottom:0}
.whybox p{font-size:13.5px;color:#c3cfe4;margin:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px}
.kv .k{color:var(--dim2);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.kv .v{color:#c9d5e8}
@media(max-width:600px){.kv{grid-template-columns:1fr;gap:2px 0}.kv .k{margin-top:8px}}

.exlist{list-style:none;margin-top:6px}
.exlist li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.exlist li:last-child{border-bottom:none}
.exlist .ejp{font-family:var(--jp);font-size:15.5px;color:#e8f0ff}
.exlist .een{font-size:12.5px;color:var(--dim);margin-top:2px}

/* ================= QUIZ ================= */
.quiz{border:1px solid var(--line2);border-radius:13px;padding:18px;background:#0b1220;margin-top:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim2);margin-bottom:12px;font-family:var(--mono)}
.qtext{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.6}
.qtext .jp{font-size:19px}
.opts{display:grid;gap:9px}
.opt{
  text-align:left;padding:12px 15px;border-radius:10px;border:1px solid var(--line2);
  background:var(--card);transition:.16s;font-size:14.5px;display:flex;gap:11px;align-items:flex-start
}
.opt:hover:not(:disabled){border-color:var(--acc);background:rgba(0,226,184,.06);transform:translateX(3px)}
.opt .k{width:20px;height:20px;flex:0 0 20px;border-radius:6px;background:#18223a;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--dim)}
.opt.correct{border-color:var(--good);background:rgba(61,220,151,.12);color:var(--good)}
.opt.correct .k{background:var(--good);color:#04140c}
.opt.wrong{border-color:var(--bad);background:rgba(255,77,109,.1);color:#ff8fa3}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:11px;padding:14px;font-size:13.5px;border:1px solid var(--line2);background:#0d1526;animation:fade .25s ease}
.fb.ok{border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.06)}
.fb.no{border-color:rgba(255,77,109,.4);background:rgba(255,77,109,.06)}
.fb h5{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:800}
.fb.ok h5{color:var(--good)} .fb.no h5{color:var(--bad)}
.fb .row{margin-bottom:7px}
.fb .row b{color:var(--txt)}
.qres{text-align:center;padding:24px 10px}
.qres .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}

/* ================= VOCAB / KANJI ================= */
.vcard{
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--card);
  display:flex;gap:13px;align-items:flex-start;transition:.18s
}
.vcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.vcard.learned{border-color:rgba(61,220,151,.3);background:linear-gradient(160deg,rgba(61,220,151,.05),var(--card))}
.vcard .vmain{flex:1;min-width:0}
.vcard .vjp{font-family:var(--jp);font-size:19px;font-weight:700;color:#eaf2ff;line-height:1.3}
.vcard .ven{font-size:13px;color:var(--dim);margin-top:2px}
.vcard .vex{font-size:12.5px;color:var(--dim2);margin-top:6px;font-family:var(--jp);border-left:2px solid var(--line2);padding-left:8px}
.vcard .vex .en{font-family:var(--ui);color:var(--dim2);font-size:11.5px}
.vcard .vbtn{flex:0 0 auto}
.kcard{
  border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);transition:.18s
}
.kcard:hover{border-color:var(--line2)}
.kcard.learned{border-color:rgba(61,220,151,.3);background:linear-gradient(160deg,rgba(61,220,151,.05),var(--card))}
.kcard .kbig{
  font-family:var(--jp);font-size:46px;line-height:1;font-weight:600;color:var(--acc);
  text-shadow:0 0 26px rgba(0,226,184,.35);margin-bottom:8px
}
.kcard .kmean{font-size:13px;color:var(--txt);font-weight:700;margin-bottom:8px}
.kcard .krow{font-size:12px;color:var(--dim);margin-bottom:3px}
.kcard .krow b{color:var(--dim2);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.kcard .kwords{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--jp);font-size:13.5px;color:#c9d5e8}

/* ================= TABLE ================= */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.tbl th{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line2);color:var(--dim2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:rgba(255,255,255,.017)}
.tbl .jp{font-size:15px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ================= MISC ================= */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--dim);margin:0 6px 6px 0}
.callout{border-left:3px solid var(--acc);background:rgba(0,226,184,.05);padding:11px 15px;border-radius:0 10px 10px 0;font-size:13.5px;color:#c3cfe4;margin:12px 0}
.callout.warn{border-color:var(--warn);background:rgba(255,176,32,.05)}
.callout.bad{border-color:var(--bad);background:rgba(255,77,109,.05)}
.callout.b{border-color:var(--acc2);background:rgba(109,94,252,.05)}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
@media(max-width:700px){.cal{grid-template-columns:repeat(6,1fr)}}
.cal .d{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--dim2);background:var(--card);cursor:pointer;transition:.15s
}
.cal .d:hover{border-color:var(--acc);color:var(--acc);transform:scale(1.08)}
.cal .d.done{background:linear-gradient(135deg,rgba(0,226,184,.28),rgba(109,94,252,.22));color:#eaf2ff;border-color:rgba(0,226,184,.5)}
.cal .d.cur{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(0,226,184,.35)}
.node{
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);
  cursor:pointer;transition:.18s;position:relative
}
.node:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,226,184,.1)}
.node .nt{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.1em;font-weight:700}
.node .nn{font-size:15px;font-weight:700;margin-top:3px}
.node .nd{font-size:12px;color:var(--dim2);margin-top:3px}
.arrowdown{text-align:center;color:var(--line2);font-size:19px;margin:6px 0;line-height:1}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(100px);
  background:linear-gradient(135deg,var(--acc),#00b394);color:#03130f;padding:12px 24px;
  border-radius:12px;font-weight:800;font-size:13.5px;z-index:999;opacity:0;transition:.32s;
  box-shadow:0 10px 40px rgba(0,226,184,.35);pointer-events:none;max-width:90vw;text-align:center
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:linear-gradient(135deg,var(--bad),#d6304f);color:#fff;box-shadow:0 10px 40px rgba(255,77,109,.35)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;display:none}
.overlay.show{display:block}
.spk{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:8px;
  background:rgba(0,226,184,.1);border:1px solid rgba(0,226,184,.3);color:var(--acc);
  font-size:11.5px;font-weight:700;transition:.16s
}
.spk:hover{background:rgba(0,226,184,.22);transform:scale(1.05)}
.spk.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,226,184,.5)}50%{box-shadow:0 0 0 7px rgba(0,226,184,0)}}
.hide{display:none!important}
.center{text-align:center}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .main{margin-left:0;padding:14px 15px 90px}
  .burger{display:grid;place-items:center}
  .hero h2{font-size:21px}
  .card{padding:16px;border-radius:14px}
}

/* ==========================================================================
   CONJUGATION ENGINES
   ========================================================================== */
function conjVerb(v){
  const kana=v.kana, g=v.group;
  if(g===3){
    if(kana.endsWith("する")){
      const st=kana.slice(0,-2);
      return {masu:st+"します",nai:st+"しない",te:st+"して",ta:st+"した"};
    }
    if(kana==="くる") return {masu:"きます",nai:"こない",te:"きて",ta:"きた"};
    if(kana==="する") return {masu:"します",nai:"しない",te:"して",ta:"した"};
  }
  if(g===2){
    const st=kana.slice(0,-1);
    return {masu:st+"ます",nai:st+"ない",te:st+"て",ta:st+"た"};
  }
  const last=kana.slice(-1), st=kana.slice(0,-1);
  const iM={"う":"い","く":"き","ぐ":"ぎ","す":"し","つ":"ち","ぬ":"に","ぶ":"び","む":"み","る":"り"};
  const aM={"う":"わ","く":"か","ぐ":"が","す":"さ","つ":"た","ぬ":"な","ぶ":"ば","む":"ま","る":"ら"};
  const tM={"う":"って","つ":"って","る":"って","む":"んで","ぶ":"んで","ぬ":"んで","く":"いて","ぐ":"いで","す":"して"};
  const dM={"う":"った","つ":"った","る":"った","む":"んだ","ぶ":"んだ","ぬ":"んだ","く":"いた","ぐ":"いだ","す":"した"};
  let masu=st+(iM[last]||"")+"ます", nai=st+(aM[last]||"")+"ない", te=st+(tM[last]||""), ta=st+(dM[last]||"");
  if(kana==="いく"){ te="いって"; ta="いった"; }
  if(kana==="ある"){ nai="ない"; }
  return {masu,nai,te,ta};
}
function conjAdj(a){
  if(a.type==="na") return {neg:a.kana+"じゃない",past:a.kana+"でした",pastneg:a.kana+"じゃありませんでした"};
  if(a.kana==="いい") return {neg:"よくない",past:"よかった",pastneg:"よくなかった"};
  const st=a.kana.slice(0,-1);
  return {neg:st+"くない",past:st+"かった",pastneg:st+"くなかった"};
}
function verbLabel(v){ return v.kanji && v.kanji!==v.kana ? v.kanji : v.kana; }
function adjLabel(a){ return a.kanji && a.kanji!==a.kana ? a.kanji : a.kana; }

/* ==========================================================================
   DAY CONTENT RESOLVERS
   ========================================================================== */
function verbsAsVocab(start,count){
  const out=[]; const n=VERBS.length;
  for(let i=0;i<count;i++){
    const v=VERBS[((start%n)+n)%n + i >= n ? ((start+i)%n) : ((start+i)%n)];
    out.push({jp:verbLabel(v),furigana:v.kana,romaji:v.romaji,en:"(verb) "+v.en,cat:"verbs",type:"verb",src:v});
  }
  return out;
}
function adjsAsVocab(start,count){
  const out=[]; const n=ADJ.length;
  for(let i=0;i<count;i++) out.push({jp:adjLabel(ADJ[(start+i)%n]),furigana:ADJ[(start+i)%n].kana,romaji:ADJ[(start+i)%n].romaji,en:"(adj) "+ADJ[(start+i)%n].en,cat:"adjectives",type:"adj",src:ADJ[(start+i)%n]});
  return out;
}
function vocabForDay(d){
  const D=DAYS[d-1]; let pool=[];
  (D.vocab||[]).forEach(c=>{
    if(c==="verbs") pool=pool.concat(verbsAsVocab(((d-1)*13)%VERBS.length,25));
    else if(c==="adjectives") pool=pool.concat(adjsAsVocab(((d-1)*11)%ADJ.length,25));
    else pool=pool.concat(NOUNS.filter(w=>w.cat===c));
  });
  // de-duplicate
  const seen=new Set(); const out=[];
  pool.forEach(w=>{ const key=w.jp+"|"+w.en; if(!seen.has(key)){seen.add(key); out.push(w);} });
  return out.slice(0,25);
}
function kanjiForDay(d){
  const per=10, n=KANJI.length, start=((d-1)*per)%n, out=[];
  for(let i=0;i<per;i++) out.push(KANJI[(start+i)%n]);
  return out;
}
function isKanjiReview(d){ return d>Math.ceil(KANJI.length/10); }

function secKey(d,id){ return d+":"+id; }
function isDone(d,id){ return !!S.sections[secKey(d,id)]; }
function setDone(d,id,val){
  const k=secKey(d,id);
  if(val && !S.sections[k]){
    S.sections[k]=true;
    if(id==="grammar" || id==="particles"){
      const D=DAYS[d-1];
      (D.focus||[]).forEach(gid=>{ if(GRAMMAR[gid]) S.grammarRead[gid]=todayISO(); });
    }
    addXP(15); touchStreak(); scheduleReviewsFor(d,id);
  }
  else if(!val){

      const D=DAYS[d-1];
      (D.focus||[]).forEach(gid=>{ if(GRAMMAR[gid]) delete S.grammarRead[gid]; });
    }
  }

}
function dayProgress(d){
  const total=SECTIONS.length;
  let done=0; SECTIONS.forEach(s=>{ if(isDone(d,s.id)) done++; });
  return Math.round(done/total*100);
}
function dayComplete(d){ return dayProgress(d)===100; }

/* ---- reviews (spaced repetition) ---- */
const INTERVALS=[1,2,4,7,14,30];
function scheduleReviewsFor(day,secId){
  const D=DAYS[day-1];
  if(secId==="grammar"||secId==="particles"){
    (D.focus||[]).forEach(gid=>{
      const g=GRAMMAR[gid]; if(!g) return;
      const key="g:"+gid;
      if(!S.reviews[key]) S.reviews[key]={label:g.t,stage:0,due:addDays(todayISO(),INTERVALS[0]),type:"grammar",ref:gid};
    });
  }
  if(secId==="vocab"){
    const vs=vocabForDay(day).slice(0,8);
    vs.forEach((w,i)=>{
      const key="v:"+w.jp+"|"+w.en;
      if(!S.reviews[key]) S.reviews[key]={label:w.jp+" — "+w.en,stage:0,due:addDays(todayISO(),INTERVALS[0]),type:"vocab",ref:w.jp};
    });
  }
  if(secId==="kanji"){
    kanjiForDay(day).slice(0,5).forEach(k=>{
      const key="k:"+k.k;
      if(!S.reviews[key]) S.reviews[key]={label:k.k+" — "+k.mean,stage:0,due:addDays(todayISO(),INTERVALS[0]),type:"kanji",ref:k.k};
    });
  }
  save();
}
function dueReviews(){
  const t=todayISO();
  return Object.keys(S.reviews).filter(k=>S.reviews[k].due<=t);
}
function completeReview(key){
  const r=S.reviews[key]; if(!r) return;
  r.stage++;
  if(r.stage>=INTERVALS.length) delete S.reviews[key];
  else r.due=addDays(todayISO(),INTERVALS[r.stage]);
  save();
}

function recordAnswer(topic,correct){

function weakTopics(minTotal){
  minTotal=minTotal||4;
  const out=[];
  Object.keys(S.topics).forEach(k=>{
    const s=S.topics[k];
    if(s.t>=minTotal){
      const p=pct(s.c,s.t);
      if(p<80) out.push({topic:k,score:p,c:s.c,t:s.t});
    }
  });
  out.sort((a,b)=>a.score-b.score);
  return out;
}
const TOPIC_LABEL={particles:"Particles",verbs:"Verb System",adjectives:"Adjectives",desu:"です System",sentence:"Sentence Structure",grammar:"Grammar Patterns",questions:"Question Words",time:"Time & Counters",reading:"Reading",vocab:"Vocabulary",kanji:"Kanji",general:"General"};

/* ==========================================================================
   QUESTION GENERATORS
   ========================================================================== */
function genVocabQ(word,pool){
  const wrong=shuffle(pool.filter(w=>w.en!==word.en)).slice(0,3).map(w=>w.en);
  while(wrong.length<3) wrong.push("(none of these)");
  const opts=shuffle([word.en].concat(wrong));
  return {
    t:"vocab",
    q:"What does 「"+word.jp+"」 mean?",
    opts:opts, a:opts.indexOf(word.en),
    why:"「"+word.jp+"」("+word.furigana+") = "+word.en,
    rule:word.ex?("Example: "+word.ex):("Category: "+word.cat),
    mis:"Read the whole word — kana length matters."
  };
}
function genKanjiMeanQ(k,pool){
  const wrong=shuffle(pool.filter(x=>x.mean!==k.mean)).slice(0,3).map(x=>x.mean);
  const opts=shuffle([k.mean].concat(wrong));
  return {t:"kanji",q:"What is the meaning of 「"+k.k+"」?",opts:opts,a:opts.indexOf(k.mean),
    why:"「"+k.k+"」 means: "+k.mean+". Readings: "+(k.kun!=="-"?k.kun:"-")+" / "+(k.on!=="-"?k.on:"-"),
    rule:"Example: "+k.ex, mis:"Do not confuse on-yomi and kun-yomi readings."};
}
function genKanjiWordQ(k){
  const w=k.words[0]||"";
  const wrong=shuffle(KANJI.filter(x=>x.k!==k.k)).slice(0,3).map(x=>x.words[0]||x.k);
  const opts=shuffle([w].concat(wrong));
  return {t:"kanji",q:"Which word contains 「"+k.k+"」?",opts:opts,a:opts.indexOf(w),
    why:"「"+k.k+"」 appears in: "+k.words.join(" / "),
    rule:"Meaning: "+k.mean, mis:"Look for the character inside the word."};
}
function genVerbQ(v){
  const c=conjVerb(v);
  const forms=[["ます",c.masu],["ない",c.nai],["て",c.te],["た",c.ta]];
  const pick=forms[Math.floor(Math.random()*forms.length)];
  const wrong=shuffle(["ます","ない","て","た"].filter(f=>f!==pick[0])).slice(0,3);
  const opts=shuffle([pick[1],c.masu,c.nai,c.te,c.ta].filter((x,i,arr)=>arr.indexOf(x)===i).slice(0,4));
  if(opts.indexOf(pick[1])<0) opts[0]=pick[1];
  const finalOpts=shuffle([pick[1]].concat(shuffle(opts.filter(o=>o!==pick[1])).slice(0,3)));
  return {t:"verbs",q:"What is the "+pick[0]+"-form of 「"+v.kana+"」 ("+v.en+")?",
    opts:finalOpts,a:finalOpts.indexOf(pick[1]),
    why:"「"+v.kana+"」 is Group "+v.group+". Forms: ます→"+c.masu+" / ない→"+c.nai+" / て→"+c.te+" / た→"+c.ta,
    rule:v.group===1?"Group 1 (godan): final u-sound changes.":v.group===2?"Group 2 (ichidan): drop る and add the ending.":"Group 3 (irregular): memorise.",
    mis:v.kana==="いく"?"いく is the exception: いって / いった, NOT いいて.":"Check the verb group before conjugating."};
}
function genAdjQ(a){
  const f=conjAdj(a);
  const forms=[["negative",f.neg],["past",f.past],["past negative",f.pastneg]];
  const pick=forms[Math.floor(Math.random()*3)];
  const others=shuffle([f.neg,f.past,f.pastneg,a.kana].filter(x=>x!==pick[1]));
  const opts=shuffle([pick[1]].concat(others.slice(0,3)));
  return {t:"adjectives",q:"What is the "+pick[0]+" form of 「"+a.kana+"」 ("+a.en+")?",
    opts:opts,a:opts.indexOf(pick[1]),
    why:"「"+a.kana+"」 is a "+a.type+"-adjective. "+a.type+"-adjective forms: "+f.neg+" / "+f.past+" / "+f.pastneg,
    rule:a.type==="na"?"な-adjectives use the です system (じゃない / でした).":"い-adjectives drop い and add くない / かった.",
    mis:a.kana==="いい"?"いい is irregular: よくない / よかった / よくなかった.":a.kana==="きれい"?"きれい ends in い but is a な-adjective!":"Watch the adjective type."};
}

/* ==========================================================================
   BUILD QUIZZES
   ========================================================================== */
function bankByTopics(topics,n){
  const pool=BANK.filter(b=>topics.indexOf(b.t)>=0);
  return shuffle(pool).slice(0,n);
}
function buildQuestions(day,kind){
  const D=DAYS[day-1];
  const vpool=vocabForDay(day);
  const kpool=kanjiForDay(day);
  const allV=NOUNS.concat(verbsAsVocab(0,VERBS.length)).concat(adjsAsVocab(0,ADJ.length));
  let qs=[];

  if(kind==="practice"){
    const nv=Math.min(3,vpool.length);
    for(let i=0;i<nv;i++) qs.push(genVocabQ(vpool[i],allV));
    for(let i=0;i<2;i++) qs.push(genKanjiMeanQ(kpool[i],KANJI));
    qs=qs.concat(bankByTopics(D.qtopics,4));
    const verbs=shuffle(VERBS).slice(0,2); verbs.forEach(v=>qs.push(genVerbQ(v)));
    const adjs=shuffle(ADJ).slice(0,1); adjs.forEach(a=>qs.push(genAdjQ(a)));
  }
  else if(kind==="jlpt"){
    for(let i=0;i<2;i++) qs.push(genVocabQ(vpool[(i+7)%vpool.length],allV));
    qs.push(genKanjiWordQ(kpool[3]));
    qs=qs.concat(bankByTopics(D.qtopics,4));
    const v=shuffle(VERBS)[0]; qs.push(genVerbQ(v));
    const a=shuffle(ADJ)[0]; qs.push(genAdjQ(a));
  }
  else if(kind==="test"){
    // today + previous days
    const prev=[];
    for(let dd=Math.max(1,day-6);dd<=day;dd++) prev.push(dd);
    const topics=new Set();
    prev.forEach(dd=>(DAYS[dd-1].qtopics||[]).forEach(t=>topics.add(t)));
    qs=qs.concat(bankByTopics(Array.from(topics),8));
    for(let i=0;i<4;i++) qs.push(genVocabQ(vpool[i%vpool.length],allV));
    qs=qs.concat(kpool.slice(0,3).map(k=>genKanjiMeanQ(k,KANJI)));
    const v=shuffle(VERBS).slice(0,2); v.forEach(x=>qs.push(genVerbQ(x)));
    const a=shuffle(ADJ).slice(0,2); a.forEach(x=>qs.push(genAdjQ(x)));
  }
  else if(kind==="final"){
    qs=qs.concat(bankByTopics(["vocab","kanji","particles","verbs","adjectives","grammar","reading","desu","sentence","time","questions"],14));
    for(let i=0;i<4;i++) qs.push(genVocabQ(vpool[i%vpool.length],allV));
    qs=qs.concat(kpool.slice(0,4).map(k=>genKanjiMeanQ(k,KANJI)));
    shuffle(VERBS).slice(0,3).forEach(x=>qs.push(genVerbQ(x)));
    shuffle(ADJ).slice(0,3).forEach(x=>qs.push(genAdjQ(x)));
  }
  else if(kind==="review"){
    const due=dueReviews();
    const weak=weakTopics(2).map(w=>w.topic);
    const topics=weak.length?weak:D.qtopics;
    qs=qs.concat(bankByTopics(topics,6));
    due.slice(0,6).forEach(k=>{
      const r=S.reviews[k];
      if(r.type==="kanji"){
        const kk=KANJI.find(x=>x.k===r.ref); if(kk) qs.push(genKanjiMeanQ(kk,KANJI));
      } else if(r.type==="vocab"){
        const vv=allV.find(x=>x.jp===r.ref); if(vv) qs.push(genVocabQ(vv,allV));
      } else if(r.type==="grammar"){
        const b=bankByTopics(["grammar","particles","verbs","adjectives"],1); qs=qs.concat(b);
      }
    });
  }
  // dedupe + cap
  const seen=new Set(); const out=[];
  qs.forEach(q=>{
    if(!q||!q.opts||q.opts.length<2) return;
    const key=q.q+"|"+q.opts.join(",");
    if(seen.has(key)) return; seen.add(key); out.push(q);
  });
  return out.slice(0,kind==="final"?26:10);
}

const RUNS={};
function startQuiz(containerId,questions,meta){

function drawQuiz(cid){
  const r=RUNS[cid]; if(!r) return;
  const box=document.getElementById(cid); if(!box) return;
  if(r.i>=r.qs.length) return drawResult(cid);
  const q=r.qs[r.i];
  const letter=["A","B","C","D","E"];
  let h='<div class="quiz">';
  h+='<div class="qhead"><span>Q '+(r.i+1)+' / '+r.qs.length+'</span><span>'+(r.meta.label||"")+'</span></div>';
  h+='<div class="bar thin" style="margin-bottom:14px"><i style="width:'+Math.round(r.i/r.qs.length*100)+'%"></i></div>';
  h+='<div class="qtext">'+renderJP(q.q)+'</div>';
  h+='<div class="opts">';
  q.opts.forEach((o,idx)=>{
    h+='<button class="opt" data-act="ans" data-cid="'+cid+'" data-i="'+idx+'"><span class="k">'+letter[idx]+'</span><span>'+renderJP(o)+'</span></button>';
  });
  h+='</div><div id="fb-'+cid+'"></div>';
  h+='<div class="btnrow" id="nav-'+cid+'"></div>';
  h+='</div>';
  box.innerHTML=h;
}
function renderJP(s){
  s=String(s);
  // add romaji hint for pure-kana/kanji strings when enabled
  if(!S.settings.romaji) return esc(s);
  // Only auto-romaji if string contains kana and no latin letters
  if(/[\u3040-\u30ff]/.test(s) && !/[\u4e00-\u9fafA-Za-z]/.test(s)){
    const r=kanaToRomaji(s.replace(/[（）()]/g,""));
    return esc(s)+(r ? ' <span class="rom">'+esc(r)+'</span>' : "");
  }
  return esc(s);
}
function answerQuiz(cid,idx){
  const r=RUNS[cid]; if(!r||r.answered) return;
  const q=r.qs[r.i];
  const ok=idx===q.a;
  r.answered=true;
  if(ok) r.correct++; else r.wrong.push({q:q,chosen:idx});
  recordAnswer(q.t||r.meta.topic,ok);
  if(!ok){
    S.wrong.push({q:q.q,correct:q.opts[q.a],chosen:q.opts[idx],topic:q.t||"general",day:r.meta.day||0,date:todayISO()});
    if(S.wrong.length>400) S.wrong.shift();
    save();
  }
  if(ok) addXP(2);
  // render feedback
  const opts=$$('#'+cid+' .opt');
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add("correct");
    else if(i===idx) b.classList.add("wrong");
  });
  const fb=document.getElementById("fb-"+cid);
  const letter=["A","B","C","D","E"];
  let fh='<div class="fb '+(ok?"ok":"no")+'">';
  fh+='<h5>'+(ok?"✓ Correct":"✕ Not quite")+'</h5>';
  fh+='<div class="row"><b>Correct answer:</b> '+esc(q.opts[q.a])+'</div>';
  if(!ok) fh+='<div class="row"><b>You chose:</b> '+esc(q.opts[idx])+'</div>';
  fh+='<div class="row"><b>Why:</b> '+esc(q.why||"")+'</div>';
  if(q.rule) fh+='<div class="row"><b>Rule:</b> '+esc(q.rule)+'</div>';
  if(q.mis) fh+='<div class="row"><b>Common mistake:</b> '+esc(q.mis)+'</div>';
  fh+='</div>';
  fb.innerHTML=fh;
  const nav=document.getElementById("nav-"+cid);
  nav.innerHTML='<button class="btn pri" data-act="next" data-cid="'+cid+'">'+(r.i+1>=r.qs.length?"See results →":"Next question →")+'</button>';
  save();
}
function nextQuiz(cid){
  const r=RUNS[cid]; if(!r) return;
  r.i++; r.answered=false;
  if(r.i>=r.qs.length) drawResult(cid); else drawQuiz(cid);
}
function drawResult(cid){
  const r=RUNS[cid]; if(!r) return;
  const box=document.getElementById(cid); if(!box) return;
  const total=r.qs.length;
  const score=pct(r.correct,total);
  let h='<div class="quiz"><div class="qres">';
  h+='<div class="big" style="color:'+(score>=80?"var(--good)":score>=60?"var(--warn)":"var(--bad)")+'">'+score+'%</div>';
  h+='<p class="muted" style="margin-top:6px">'+r.correct+' / '+total+' correct</p>';
  h+='</div>';
  if(r.wrong.length){
    h+='<div class="fb no" style="margin-top:16px"><h5>Questions answered incorrectly</h5>';
    r.wrong.forEach(w=>{
      h+='<div class="row" style="margin-bottom:12px"><b>'+esc(w.q.q)+'</b><br>Your answer: '+esc(w.q.opts[w.chosen])+'<br>Correct: <b>'+esc(w.q.opts[w.q.a])+'</b><br><span class="tiny">'+esc(w.q.why||"")+'</span></div>';
    });
    h+='</div>';
  }
  const weakTopicsInRun={};
  r.wrong.forEach(w=>{ const t=w.q.t||"general"; weakTopicsInRun[t]=(weakTopicsInRun[t]||0)+1; });
  const wt=Object.keys(weakTopicsInRun);
  if(wt.length){
    h+='<div class="callout warn" style="margin-top:14px"><b>Weak topics from this session:</b> '+wt.map(t=>TOPIC_LABEL[t]||t).join(", ")+'<br><span class="tiny">These have been added to your Weak Topics list and will appear in your review.</span></div>';
  } else {
    h+='<div class="callout" style="margin-top:14px">No weak topics from this session. Excellent.</div>';
  }
  h+='<div class="btnrow">';
  h+='<button class="btn pri" data-act="quiz-again" data-cid="'+cid+'">Retry</button>';
  if(r.meta.day) h+='<button class="btn gh" data-act="back-day" data-day="'+r.meta.day+'">Back to Day '+r.meta.day+'</button>';
  h+='</div></div>';
  box.innerHTML=h;
  if(r.meta.day && r.meta.section){
    setDone(r.meta.day,r.meta.section,true);
  }
  if(r.meta.day && r.meta.section==="test"){
    S.tests[r.meta.day]={score:r.correct,total:total,date:todayISO()};
    S.dayScore[r.meta.day]=score;
    if(score>=60 && r.meta.day===S.currentDay && S.currentDay<30){ S.currentDay++; }
    addXP(50);
    save(); paintTop();
  }
  if(r.meta.day && r.meta.section) render();
}

function doneBtn(d,sec){
  const done=isDone(d,sec);

function particleMapTable(){
  const rows=[
   ["は","topic","わたしは がくせいです。","Using は when が is needed"],
   ["が","subject / new info","ねこが います。","Using は after question words"],
   ["を","direct object","りんごを たべます。","Using を with movement verbs"],
   ["に","destination / time / target / existence","７じに おきます。","Using に for action locations"],
   ["で","action location / means / material","としょかんで べんきょうします。","Using で for existence"],
   ["へ","direction","にほんへ いきます。","Using へ with あります"],
   ["の","possession / connection","わたしの ほん","Reversing the nouns"],
   ["と","complete list / with / quote","パンと たまご","Using と for incomplete lists"],
   ["も","also / too","わたしも がくせいです。","Writing はも"],
   ["から","from / because","９じから","Confusing with まで"],
   ["まで","until / as far as","５じまで","Confusing with までに"],
   ["や","partial list","やさいや くだもの","Using や for complete lists"]
  ];
  let h='<div class="tblwrap"><table class="tbl"><thead><tr><th>Particle</th><th>Function</th><th>Example</th><th>Common mistake</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><td class="jp" style="color:var(--acc);font-weight:700;font-size:17px">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="jp">'+esc(r[2])+'</td><td class="tiny">'+esc(r[3])+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

  Object.keys(S.tests).sort((a,b)=>a-b).forEach(k=>{
    const t=S.tests[k]; const p=pct(t.score,t.total);
    h+='<tr><td>Day '+k+'</td><td style="color:'+(p>=80?"var(--good)":p>=60?"var(--warn)":"var(--bad)")+'">'+p+'%</td><td>'+t.score+' / '+t.total+'</td><td class="tiny">'+t.date+'</td></tr>';

  h+='<div class="card"><h3>Study activity (XP per day)</h3>';

  if(!days.length) h+='<p>No activity recorded yet.</p>';

  h+='</ul></div>';
  return h;
}

/* ==========================================================================
   ACTION HANDLERS
   ========================================================================== */
function speak(text){
  if(!("speechSynthesis" in window)){ toast("Speech synthesis is not available in this browser.",true); return; }
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; u.rate=0.85; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const jp=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("ja"));
    if(jp) u.voice=jp;
    window.speechSynthesis.speak(u);
    if(!jp && voices.length){ /* still try default */ }
    if(!voices.length){
      setTimeout(()=>{ if(!window.speechSynthesis.getVoices().length) toast("No speech voices found on this device. Use the transcript instead.",true); },600);
    }
  }catch(e){ toast("Could not play audio. Use the transcript instead.",true); }
}

document.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const act=t.dataset.act;

  if(act==="start-system"){
    S.welcomeSeen=true; S.startDate=todayISO(); save();
    location.hash="#/day/1"; return;
  }

  if(act==="toggle-sec"){
    const sec=t.closest(".sec");
    sec.classList.toggle("open");
    return;
  }

  if(act==="why"){
    const box=document.getElementById("why-"+t.dataset.gid);
    if(box) box.classList.toggle("open");
    return;
  }

  if(act==="toggle-node"){
    const box=document.getElementById("node-"+t.dataset.node);
    if(box) box.classList.toggle("hide");
    return;
  }

  if(act==="mark-sec"||act==="toggle-sec-done"){
    const d=+t.dataset.day, sec=t.dataset.sec;
    setDone(d,sec,!isDone(d,sec));
    render();
    return;
  }

  if(act==="learn-vocab"){
    const k=t.dataset.key;
    if(S.vocabLearned[k]) delete S.vocabLearned[k];
    else { S.vocabLearned[k]=todayISO(); addXP(3); touchStreak(); }
    save(); render(); return;
  }

  if(act==="learn-kanji"){
    const k=t.dataset.key;
    if(S.kanjiLearned[k]) delete S.kanjiLearned[k];
    else { S.kanjiLearned[k]=todayISO(); addXP(4); touchStreak(); }
    save(); render(); return;
  }

  if(act==="start-quiz"){
    const kind=t.dataset.kind, day=+(t.dataset.day||S.currentDay);
    let qs=[], meta={label:"",day:day};
    if(kind==="practice"){ qs=buildQuestions(day,"practice"); meta.label="Practice"; meta.section="practice"; }
    else if(kind==="jlpt"){ qs=buildQuestions(day,"jlpt"); meta.label="JLPT"; meta.section="jlpt"; }
    else if(kind==="test"){ qs=buildQuestions(day,"test"); meta.label="End-of-Day Test"; meta.section="test"; }
    else if(kind==="final"){ qs=buildQuestions(30,"final"); meta.label="N5 Readiness Test"; meta.section="test"; }
    else if(kind==="review"){ qs=buildQuestions(day,"review"); meta.label="Review"; meta.section="review"; }
    else if(kind==="particletest"){ qs=shuffle(BANK.filter(b=>b.t==="particles")).slice(0,20); meta.label="Particle Test"; }
    else if(kind==="verbtest"){ qs=shuffle(VERBS).slice(0,10).map(genVerbQ); meta.label="Verb Test"; }
    else if(kind==="adjtest"){ qs=shuffle(ADJ).slice(0,10).map(genAdjQ); meta.label="Adjective Test"; }
    else if(kind==="vocabtest"){
      const vp=vocabForDay(day), allV=NOUNS.concat(verbsAsVocab(0,VERBS.length)).concat(adjsAsVocab(0,ADJ.length));
      qs=vp.slice(0,3).map(w=>genVocabQ(w,allV)).concat(kanjiForDay(day).slice(0,3).map(k=>genKanjiMeanQ(k,KANJI)));
      meta.label="Vocab & Kanji";
    }
    else if(kind==="reading"){
      const R=READINGS[+t.dataset.idx];
      qs=R.qs.map(q=>({t:"reading",q:q.q,opts:q.opts,a:q.a,why:q.why,rule:"Re-read the passage around the keyword.",mis:"Do not translate the whole passage — find the keyword."}));
      meta.label="Reading";
    }
    else if(kind==="listen"){
      const L=LISTENINGS[DAYS[day-1].listen % LISTENINGS.length];
      qs=L.qs.map(q=>({t:"listening",q:q.q,opts:q.opts,a:q.a,why:q.why,rule:"Listen for the key word, not every word.",mis:"Do not try to catch every syllable."}));
      meta.label="Listening";
    }
    else if(kind==="listenidx"){
      const L=LISTENINGS[+t.dataset.idx];
      qs=L.qs.map(q=>({t:"listening",q:q.q,opts:q.opts,a:q.a,why:q.why,rule:"Listen for the key word.",mis:"Do not try to catch every syllable."}));
      meta.label="Listening";
    }
    else if(kind==="compare"){
      const c=COMPARED[+t.dataset.idx];
      qs=[{t:"particles",q:c.quiz.q,opts:c.quiz.opts,a:c.quiz.a,why:c.quiz.why,rule:c.diff,mis:c.mistakes}];
      meta.label="Mini Quiz";
    }
    if(!qs.length){ toast("No questions available for this set.",true); return; }
    // container id
    let cid;
    if(kind==="particletest") cid="quiz-particletest-6";
    else if(kind==="verbtest") cid="quiz-verbtest-14";
    else if(kind==="adjtest") cid="quiz-adjtest-16";
    else if(kind==="reading") cid="quiz-reading-"+t.dataset.idx;
    else if(kind==="listenidx") cid="quiz-listenidx-"+t.dataset.idx;
    else if(kind==="compare") cid="quiz-compare-"+t.dataset.idx;
    else if(kind==="vocabtest") cid="quiz-vocabtest-"+day;
    else if(kind==="final") cid="quiz-final-30";
    else if(kind==="listen") cid="quiz-listen-"+day;
    else cid="quiz-"+kind+"-"+day;
    let box=document.getElementById(cid);
    if(!box){
      // create a floating quiz container
      box=document.createElement("div");
      box.id=cid;
      t.parentNode.appendChild(box);
    }
    startQuiz(cid,qs,meta);
    box.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }

  if(act==="ans"){ answerQuiz(t.dataset.cid,+t.dataset.i); return; }
  if(act==="next"){ nextQuiz(t.dataset.cid); return; }

  if(act==="quiz-again"){
    const r=RUNS[t.dataset.cid];
    if(r){ startQuiz(t.dataset.cid,shuffle(r.qs),r.meta); }
    return;
  }
  if(act==="back-day"){ location.hash="#/day/"+t.dataset.day; return; }
  if(act==="go-day"){ location.hash="#/day/"+t.dataset.day; return; }

  if(act==="speak"){ speak(t.dataset.text); return; }

  if(act==="show-transcript"){
    const el=document.getElementById(t.dataset.target);
    if(el) el.classList.toggle("hide");
    return;
  }

  if(act==="review-done"){
    completeReview(t.dataset.key); addXP(3); render(); return;
  }

  if(act==="quicktest"){
    const qs=buildQuestions(S.currentDay,"practice");
    let box=document.getElementById("quicktest-box");
    if(!box){ box=document.createElement("div"); box.id="quicktest-box"; $(".main").appendChild(box); }
    box.innerHTML='<div class="card"><h3>⚡ Quick Test</h3><div id="quiz-quick"></div></div>';
    startQuiz("quiz-quick",qs,{label:"Quick Test",day:S.currentDay});
    box.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }

  if(act==="toggle-romaji"){ S.settings.romaji=!S.settings.romaji; save(); render(); return; }
  if(act==="toggle-furigana"){ S.settings.furigana=!S.settings.furigana; save(); render(); return; }

  if(act==="save-minna"){
    S.minna.lesson=$("#minna-lesson").value;
    S.minna.grammar=$("#minna-grammar").value;
    S.minna.notes=$("#minna-notes").value;
    save(); toast("School tracker saved."); return;
  }

  if(act==="set-day"){
    const v=prompt("Enter day number (1-30):",S.currentDay);
    if(v===null) return;
    const n=parseInt(v,10);
    if(isNaN(n)||n<1||n>30){ toast("Please enter a number between 1 and 30.",true); return; }
    S.currentDay=n; save(); paintTop(); render(); toast("Current day set to Day "+n+".");
    return;
  }

  if(act==="export"){
    const data=JSON.stringify(S,null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="n5-progress-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Progress exported.");
    return;
  }

  if(act==="reset"){
    if(confirm("This will permanently delete ALL progress: XP, streak, vocabulary, kanji, tests, weak topics and review schedule.\n\nThis cannot be undone. Continue?")){
      if(confirm("Final confirmation. Really reset everything?")){
        localStorage.removeItem(LS_KEY);
        S=defaultState(); save();
        location.hash="#/welcome"; paintTop(); paintNav(); render();
        toast("Progress reset.");
      }
    }
    return;
  }
});

/* ==========================================================================
   ROUTER
   ========================================================================== */
function render(){
  const raw=(location.hash.replace(/^#\/?/,"")||"dashboard");
  const parts=raw.split("/");
  const route=parts[0];
  const param=parts[1];
  const main=$("#view");

  if(!S.welcomeSeen && route!=="welcome"){
    main.innerHTML=viewWelcome();
    paintNav(); paintTop();
    return;
  }

  let html="";
  switch(route){
    case "welcome": html=viewWelcome(); break;
    case "dashboard": html=viewDashboard(); break;
    case "plan": html=viewPlan(); break;
    case "day": html=viewDay(param?parseInt(param,10):S.currentDay); break;
    case "grammar": html=viewGrammarMap(); break;
    case "particles": html=viewParticles(); break;
    case "verbs": html=viewVerbs(); break;
    case "adjectives": html=viewAdjectives(); break;
    case "compare": html=viewCompare(); break;
    case "vocab": html=viewVocab(); break;
    case "kanji": html=viewKanji(); break;
    case "reading": html=viewReading(); break;
    case "listening": html=viewListening(); break;
    case "speaking": html=viewSpeaking(); break;
    case "jlpt": html=viewJlpt(); break;
    case "reviews": html=viewReviews(); break;
    case "weak": html=viewWeak(); break;
    case "progress": html=viewProgress(); break;
    case "minna": html=viewMinna(); break;
    case "settings": html=viewSettings(); break;
    default: html=viewDashboard();
  }
  main.innerHTML=html;
  paintNav();
  paintTop();
  window.scrollTo(0,0);
}

/* ==========================================================================
   INIT
   ========================================================================== */
function init(){
  load();
  // warm up speech voices
  if("speechSynthesis" in window){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=()=>{}; }
  $("#burger").addEventListener("click",()=>{ $("#sidebar").classList.toggle("open"); $("#ov").classList.toggle("show"); });
  $("#ov").addEventListener("click",()=>{ $("#sidebar").classList.remove("open"); $("#ov").classList.remove("show"); });
  window.addEventListener("hashchange",render);
  if(!location.hash){
    location.hash = S.welcomeSeen ? "#/dashboard" : "#/welcome";
  }
  render();
}
init();
